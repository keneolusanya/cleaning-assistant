[project]
name = "chorebot"
version = "0.1.0"
description = "SMS chore bot for the suite"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "twilio>=9",
    "flask>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chorebot = "chorebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chorebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
